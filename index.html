<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevOps, DevSecOps e CI/CD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--u:1vw;--c:#29e0ff;--o:#ff8a1f;--bg:#020611;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;color:#e8f6ff}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;container-type:inline-size;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,4,14,.75) 100%),linear-gradient(transparent 70%,rgba(0,6,20,.7))}
#bar{position:absolute;left:0;top:0;height:calc(.35*var(--u));width:0;background:linear-gradient(90deg,var(--c),var(--o));box-shadow:0 0 calc(1*var(--u)) var(--c);transition:width 1.6s ease}
#cap{position:absolute;left:calc(4*var(--u));bottom:calc(5*var(--u));opacity:0;transform:translateY(calc(1.2*var(--u)));transition:opacity .6s,transform .6s;background:rgba(3,10,28,.62);backdrop-filter:blur(6px);padding:calc(1.5*var(--u)) calc(2*var(--u));border-radius:calc(.8*var(--u));border:1px solid rgba(41,224,255,.25);max-width:min(calc(48*var(--u)),92%)}
#cap.in{opacity:1;transform:none}
#cap.wide{max-width:min(calc(80*var(--u)),92%)}#bl li.plain{padding-left:0}#bl li.plain:before{content:none}
#fim{position:absolute;left:50%;bottom:calc(6*var(--u));height:calc(30*var(--u));width:calc(30*var(--u));transform:translateX(-50%);display:none;border-radius:calc(.8*var(--u));border:1px solid rgba(41,224,255,.45);box-shadow:0 0 calc(2*var(--u)) rgba(41,224,255,.35);object-fit:cover;pointer-events:none}
#qr{position:absolute;left:50%;top:50%;width:calc(34*var(--u));height:calc(34*var(--u));transform:translate(-50%,-50%);border:calc(.25*var(--u)) dashed rgba(41,224,255,.7);border-radius:calc(1*var(--u));background:rgba(3,10,28,.78);display:none;pointer-events:none}
#cap.hero{max-width:min(calc(54*var(--u)),92%)}#cap.top{bottom:auto;top:calc(3.5*var(--u))}
#tag{font:700 max(calc(.95*var(--u)),8px) Orbitron,Arial;letter-spacing:.3em;color:var(--o);margin-bottom:calc(.8*var(--u))}
#ttl{font:900 max(calc(2.5*var(--u)),13px)/1.1 Orbitron,Arial;text-shadow:0 0 calc(2*var(--u)) rgba(41,224,255,.6)}
#cap.hero #ttl{font-size:max(calc(3.8*var(--u)),16px)}
#bl{list-style:none;padding:0;margin-top:calc(.9*var(--u))}#bl li{font-size:max(calc(1.2*var(--u)),9px);line-height:1.45;color:#d4ecfb;padding-left:calc(1.6*var(--u));position:relative;margin-top:calc(.45*var(--u))}
#bl li:before{content:"▸";color:var(--o);position:absolute;left:0}
#bl li b{color:#7fe3ff;font-weight:700}
#nav{position:absolute;right:calc(3*var(--u));bottom:calc(2.4*var(--u));display:flex;gap:calc(.7*var(--u));align-items:center}
#nav button{cursor:pointer;color:#cfeeff;background:rgba(4,16,40,.7);border:1px solid rgba(41,224,255,.5);border-radius:calc(.5*var(--u));font:600 max(calc(.9*var(--u)),8px) Inter,Arial;padding:calc(.5*var(--u)) calc(.9*var(--u))}
#nav button:hover,#nav button.on{background:rgba(41,224,255,.25)}
.dot{width:calc(.6*var(--u))!important;height:calc(.6*var(--u));padding:0!important;border-radius:50%!important}
.dot.on{background:var(--o)!important;border-color:var(--o)!important;box-shadow:0 0 calc(1*var(--u)) var(--o)}
#cards{position:absolute;left:calc(4*var(--u));right:calc(4*var(--u));bottom:calc(6.4*var(--u));display:flex;gap:calc(.8*var(--u));opacity:0;transform:translateY(calc(1.2*var(--u)));transition:opacity .6s,transform .6s;pointer-events:none}#cards.in{opacity:1;transform:none}
.card{flex:1;min-width:0;padding:calc(.7*var(--u)) calc(.9*var(--u));border:1px solid rgba(41,224,255,.4);border-left:calc(.3*var(--u)) solid var(--o);background:rgba(4,16,40,.7);backdrop-filter:blur(6px);border-radius:calc(.6*var(--u))}
.card b{display:block;font:700 max(calc(1.1*var(--u)),8px) Orbitron,Arial;color:#fff;text-shadow:0 0 calc(1*var(--u)) var(--c);margin-bottom:calc(.3*var(--u))}.card span{display:block;font-size:max(calc(.85*var(--u)),7px);line-height:1.4;color:#a9d3ef;margin-top:calc(.15*var(--u))}
#ld{position:absolute;inset:0;display:none;place-items:center;background:rgba(2,6,17,.82);font:700 max(calc(1.8*var(--u)),12px) Orbitron,Arial;color:#fff;z-index:5;text-align:center;padding:calc(2*var(--u))}
#cnt{font:600 max(calc(.9*var(--u)),8px) Orbitron,Arial;color:#8fc4e6;min-width:calc(4*var(--u));text-align:center}
</style></head>
